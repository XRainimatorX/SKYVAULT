# Declares what SKYVAULT needs to run. The package is not installable yet (no
# build-system table): scripts and tests still put src/ on sys.path. Install
# the dependencies with:
#   python3 -m pip install pydantic pyyaml networkx pandas fastapi uvicorn \
#       websockets python-docx reportlab pyarrow
[project]
name = "skyvault"
version = "0.16.0"
requires-python = ">=3.10"
dependencies = [
    # Contracts and JSON Schema generation (Phase 1, ADR 004).
    "pydantic>=2,<3",
    # YAML scenario files (Phase 1, ADR 004).
    "PyYAML>=6",
    # Graph and network spaces (Phase 2).
    "networkx>=3",
    # Batch aggregation (Phase 10). pandas 3 needs Python 3.11; pip picks 2.x on 3.10.
    "pandas>=2",
    # UI backend and briefing export (Phase 17).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # uvicorn has no WebSocket support of its own; the replay needs it.
    "websockets>=12",
    "python-docx>=1",
    "reportlab>=4",
    # Parquet export of training datasets (Phase 18).
    "pyarrow>=14",
    # Background world service (Phase 11): job queue and workers on Redis,
    # jobs and results in PostgreSQL (SQLite is the default store).
    "rq>=1.16",
    "redis>=5",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "bandit",
    "types-PyYAML",
    "types-networkx",
    "pandas-stubs",
    "types-reportlab",
    "pyarrow-stubs",
    # FastAPI's TestClient and reading briefing PDFs in tests (Phase 17).
    "httpx",
    "pypdf",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests/ and scripts/ put src/ on sys.path before importing skyvault, so their
# imports cannot sit at the top of the file. The permanent fix is to make the
# package installable and drop the sys.path block; until then E402 here is
# expected rather than a defect.
"tests/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/skyvault"]

[tool.coverage.report]
show_missing = true

[tool.bandit]
# B311 flags random.Random as unsuitable for cryptography. SKYVAULT uses it for
# reproducible simulation, which is the intended use, not a security control.
skips = ["B311"]
