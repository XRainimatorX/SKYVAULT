# Every check a contributor runs before a PR, run on a clean machine.
# A clean machine is the point: it has no leftover output/ files to make a
# test that reads the disk pass by accident, and no tool installed in a
# different environment to disagree with the one the code is checked by.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and development dependencies
        run: python -m pip install pydantic pyyaml networkx pandas pytest pytest-cov ruff black mypy bandit types-PyYAML types-networkx pandas-stubs fastapi uvicorn python-docx reportlab httpx pypdf types-reportlab

      - name: Lint
        run: ruff check .

      - name: Format
        run: black --check src/ tests/ scripts/

      - name: Types
        run: python -m mypy src/

      - name: Security scan
        run: python -m bandit -c pyproject.toml -r src/

      - name: Tests with coverage floor
        run: python -m pytest tests/ -q --cov --cov-fail-under=93

      - name: Tests from another working directory
        run: cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Tests must not read output/
        run: |
          if grep -rn "open(" tests/ | grep "output/"; then
            echo "A test reads output/. Call the function and check its return value instead."
            exit 1
          fi

      - name: Committed JSON Schemas match the contracts
        run: |
          python scripts/export_schemas.py
          git diff --exit-code src/skyvault/schemas/ || {
            echo "Run python3 scripts/export_schemas.py and commit the result."
            exit 1
          }

      # Generated files existing is not the same as them being right: run the
      # whole pipeline from an empty output/ and read what it wrote.
      - name: Full pipeline produces correct outputs
        run: |
          rm -f output/*.json output/timeline.txt
          python scripts/run_tactical_reference.py
          python - <<'EOF'
          import json
          from pathlib import Path

          out = Path("output")
          package = json.loads((out / "result_package.json").read_text())
          events = json.loads((out / "event_memory.json").read_text())
          timeline = (out / "timeline.txt").read_text()

          assert package["evaluation_result"]["winner_or_result"] == "RED_survived"
          assert package["evaluation_result"]["event_count"] == len(events) == 97
          assert all(len(event) == 12 and "source" in event for event in events)

          for event in events:
              if event["event_type"] != "ATTACK":
                  continue
              data = event["data"]
              shown = max(data["hp_after"], 0)
              sentence = f"HP {data['hp_before']} -> {shown} (damage = {data['damage']})"
              assert sentence in timeline, sentence

          for name in ("replay_state_at_tick", "entity_history", "causal_chain", "final_state"):
              json.loads((out / f"{name}.json").read_text())

          # Event memory is the truth: replaying it must rebuild the final world
          import sys
          sys.path.insert(0, "src")
          from skyvault.runtime import rebuild_world

          rebuilt = rebuild_world(package["initial_world_state"], package["event_memory"])
          assert rebuilt == package["final_world_state"]
          assert package["final_world_state"]["space"]["type"] == "grid"

          # Phase 7: the multi-axis verdict and its three companions
          verdict = json.loads((out / "evaluation_result.json").read_text())
          breakdown = json.loads((out / "score_breakdown.json").read_text())
          gaming = json.loads((out / "anti_gaming_report.json").read_text())
          tradeoff = (out / "tradeoff_report.md").read_text()
          assert verdict == package["evaluation_result"]
          assert verdict["profile_id"] == "balanced"
          assert verdict["overall_judgement"]["status"] == "risky"
          assert len(breakdown) == 11
          assert gaming["gaming_detected"] is True
          assert tradeoff.startswith("# Trade-off report — tactical_reference_001")
          assert "tradeoff_report" in package

          print("outputs verified")
          EOF

      - name: The same run judged under another profile
        run: |
          python scripts/run_tactical_reference.py --profile data/evaluation_profiles/tactical.json
          python - <<'EOF'
          import json
          from pathlib import Path

          verdict = json.loads(Path("output/evaluation_result.json").read_text())
          assert verdict["profile_id"] == "tactical"
          assert verdict["overall_judgement"]["status"] == "pass"
          assert verdict["event_count"] == 97
          print("profile switch verified")
          EOF

      # Phase 8: a recorded run must rerun to the same output hash, and the
      # next scenario version must be told apart from it
      - name: Reproducibility and scenario versions
        run: |
          python scripts/verify_run.py output/result_package.json
          python scripts/run_tactical_reference.py --scenario data/scenarios/tactical_reference_001/v0.2.json
          python scripts/verify_run.py output/result_package.json
          python - <<'EOF'
          import json
          from pathlib import Path

          package = json.loads(Path("output/result_package.json").read_text())
          assert package["evaluation_result"]["winner_or_result"] == "BLUE_survived"
          assert package["reproducibility"]["scenario_version"] == "v0.2"
          runs = [json.loads(line) for line in Path("runs/registry.jsonl").read_text().splitlines()]
          assert [run["scenario_version"] for run in runs] == ["v0.1", "v0.1", "v0.2"]
          assert runs[0]["input_hash"] != runs[1]["input_hash"]  # balanced, then tactical
          print("reproducibility verified")
          EOF

      # Phase 9: stress the plan and check the four failure outputs
      - name: Failure exploration
        run: |
          python scripts/explore_failures.py --repeats 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.contracts import validate_failure_map

          out = Path("output")
          failure_map = validate_failure_map(json.loads((out / "failure_map.json").read_text()))
          assert failure_map["scenario_version"] == "v0.1"
          assert failure_map["seeds"] == [42, 43]
          assert len(failure_map["variables"]) == 6
          assert [a["scenario_version"] for a in failure_map["alternatives"]] == [
              "v0.1-support-rear",
              "v0.1-spread",
          ]
          json.loads((out / "collapse_sequence.json").read_text())
          conditions = json.loads((out / "survival_conditions.json").read_text())
          assert len(conditions["per_variable"]) == 6
          text = (out / "recommended_modifications.md").read_text()
          assert text.startswith("# Recommended modifications — tactical_reference_001 v0.1")
          print("failure exploration verified")
          EOF

      # Phase 10: run the reference batch in parallel and check the four outputs
      - name: Batch simulation and conflict branches
        run: |
          python scripts/run_batch.py --repeats 10 --workers 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.contracts import validate_batch_result, validate_conflict_package

          out = Path("output")
          result = validate_batch_result(json.loads((out / "batch_result.json").read_text()))
          assert result["total_runs"] == 90 and result["workers"] == 2
          comparison = json.loads((out / "branch_comparison.json").read_text())
          assert comparison["variants"][-3:] == ["branch:P1", "branch:P2+P3", "branch:none"]
          package = validate_conflict_package(json.loads((out / "conflict_package.json").read_text()))
          assert [c["proposals"] for c in package["conflicts"]] == [["P1", "P2"], ["P1", "P3"]]
          assert package["recommendation_to_nexus"]["required_decision"] is True
          text = (out / "comparative_report.md").read_text()
          assert text.startswith("# Comparative report — tactical_reference_001_doctrine")
          print("batch verified")
          EOF

      # Phase 17: the briefing from the workspace the steps above wrote
      - name: Briefing export
        run: |
          python scripts/export_briefing.py
          python - <<'EOF'
          from pathlib import Path

          out = Path("output")
          text = (out / "briefing.md").read_text()
          for title in ["Summary", "What happened", "Failure exploration", "Plan comparison", "Reproducibility"]:
              assert f"\n## {title}\n" in text, title
          assert (out / "briefing.pdf").read_bytes().startswith(b"%PDF")
          assert (out / "briefing.docx").read_bytes().startswith(b"PK")
          print("briefing verified")
          EOF

  # Phase 17: build the UI, serve it with the reference workspace, and drive
  # every page in a real browser
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install pydantic pyyaml networkx pandas fastapi uvicorn python-docx reportlab

      - name: Write the reference workspace
        run: |
          python scripts/run_tactical_reference.py
          python scripts/explore_failures.py
          python scripts/run_batch.py

      - name: Install and build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Drive every page in a browser
        run: |
          python scripts/serve_ui.py --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          cd ui && SKYVAULT_URL=http://127.0.0.1:8000 npm run e2e
