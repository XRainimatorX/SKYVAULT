# Every check a contributor runs before a PR, run on a clean machine.
# A clean machine is the point: it has no leftover output/ files to make a
# test that reads the disk pass by accident, and no tool installed in a
# different environment to disagree with the one the code is checked by.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    # Phase 11: the world service's job queue and store run against real
    # services here; the tests that need them skip only where these are absent
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyvault
          POSTGRES_PASSWORD: skyvault
          POSTGRES_DB: skyvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skyvault" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      SKYVAULT_TEST_REDIS: redis://localhost:6379/0
      SKYVAULT_TEST_POSTGRES: postgresql://skyvault:skyvault@localhost:5432/skyvault

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and development dependencies
        run: python -m pip install pydantic pyyaml networkx pandas pytest pytest-cov ruff black mypy bandit types-PyYAML types-networkx pandas-stubs fastapi uvicorn websockets python-docx reportlab pyarrow httpx pypdf types-reportlab pyarrow-stubs rq redis "psycopg[binary]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: black --check src/ tests/ scripts/

      - name: Types
        run: python -m mypy src/

      - name: Security scan
        run: python -m bandit -c pyproject.toml -r src/

      - name: Tests with coverage floor
        run: python -m pytest tests/ -q --cov --cov-fail-under=93

      - name: Tests from another working directory
        run: cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Tests must not read output/
        run: |
          if grep -rn "open(" tests/ | grep "output/"; then
            echo "A test reads output/. Call the function and check its return value instead."
            exit 1
          fi

      - name: Committed JSON Schemas match the contracts
        run: |
          python scripts/export_schemas.py
          git diff --exit-code src/skyvault/schemas/ || {
            echo "Run python3 scripts/export_schemas.py and commit the result."
            exit 1
          }

      # Generated files existing is not the same as them being right: run the
      # whole pipeline from an empty output/ and read what it wrote.
      - name: Full pipeline produces correct outputs
        run: |
          rm -f output/*.json output/timeline.txt
          python scripts/run_tactical_reference.py
          python - <<'EOF'
          import json
          from pathlib import Path

          out = Path("output")
          package = json.loads((out / "result_package.json").read_text())
          events = json.loads((out / "event_memory.json").read_text())
          timeline = (out / "timeline.txt").read_text()

          assert package["evaluation_result"]["winner_or_result"] == "RED_survived"
          assert package["evaluation_result"]["event_count"] == len(events) == 97
          assert all(len(event) == 12 and "source" in event for event in events)

          for event in events:
              if event["event_type"] != "ATTACK":
                  continue
              data = event["data"]
              shown = max(data["hp_after"], 0)
              sentence = f"HP {data['hp_before']} -> {shown} (damage = {data['damage']})"
              assert sentence in timeline, sentence

          for name in ("replay_state_at_tick", "entity_history", "causal_chain", "final_state"):
              json.loads((out / f"{name}.json").read_text())

          # Event memory is the truth: replaying it must rebuild the final world
          import sys
          sys.path.insert(0, "src")
          from skyvault.runtime import rebuild_world

          rebuilt = rebuild_world(package["initial_world_state"], package["event_memory"])
          assert rebuilt == package["final_world_state"]
          assert package["final_world_state"]["space"]["type"] == "grid"

          # Phase 7: the multi-axis verdict and its three companions
          verdict = json.loads((out / "evaluation_result.json").read_text())
          breakdown = json.loads((out / "score_breakdown.json").read_text())
          gaming = json.loads((out / "anti_gaming_report.json").read_text())
          tradeoff = (out / "tradeoff_report.md").read_text()
          assert verdict == package["evaluation_result"]
          assert verdict["profile_id"] == "balanced"
          assert verdict["overall_judgement"]["status"] == "risky"
          assert len(breakdown) == 11
          assert gaming["gaming_detected"] is True
          assert tradeoff.startswith("# Trade-off report — tactical_reference_001")
          assert "tradeoff_report" in package

          print("outputs verified")
          EOF

      - name: The same run judged under another profile
        run: |
          python scripts/run_tactical_reference.py --profile data/evaluation_profiles/tactical.json
          python - <<'EOF'
          import json
          from pathlib import Path

          verdict = json.loads(Path("output/evaluation_result.json").read_text())
          assert verdict["profile_id"] == "tactical"
          assert verdict["overall_judgement"]["status"] == "pass"
          assert verdict["event_count"] == 97
          print("profile switch verified")
          EOF

      # Phase 8: a recorded run must rerun to the same output hash, and the
      # next scenario version must be told apart from it
      - name: Reproducibility and scenario versions
        run: |
          python scripts/verify_run.py output/result_package.json
          python scripts/run_tactical_reference.py --scenario data/scenarios/tactical_reference_001/v0.2.json
          python scripts/verify_run.py output/result_package.json
          python - <<'EOF'
          import json
          from pathlib import Path

          package = json.loads(Path("output/result_package.json").read_text())
          assert package["evaluation_result"]["winner_or_result"] == "BLUE_survived"
          assert package["reproducibility"]["scenario_version"] == "v0.2"
          runs = [json.loads(line) for line in Path("runs/registry.jsonl").read_text().splitlines()]
          assert [run["scenario_version"] for run in runs] == ["v0.1", "v0.1", "v0.2"]
          assert runs[0]["input_hash"] != runs[1]["input_hash"]  # balanced, then tactical
          print("reproducibility verified")
          EOF

      # Phase 9: stress the plan and check the four failure outputs
      - name: Failure exploration
        run: |
          python scripts/explore_failures.py --repeats 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.contracts import validate_failure_map

          out = Path("output")
          failure_map = validate_failure_map(json.loads((out / "failure_map.json").read_text()))
          assert failure_map["scenario_version"] == "v0.1"
          assert failure_map["seeds"] == [42, 43]
          assert len(failure_map["variables"]) == 6
          assert [a["scenario_version"] for a in failure_map["alternatives"]] == [
              "v0.1-support-rear",
              "v0.1-spread",
          ]
          json.loads((out / "collapse_sequence.json").read_text())
          conditions = json.loads((out / "survival_conditions.json").read_text())
          assert len(conditions["per_variable"]) == 6
          text = (out / "recommended_modifications.md").read_text()
          assert text.startswith("# Recommended modifications — tactical_reference_001 v0.1")
          print("failure exploration verified")
          EOF

      # Phase 10: run the reference batch in parallel and check the four outputs
      - name: Batch simulation and conflict branches
        run: |
          python scripts/run_batch.py --repeats 10 --workers 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.contracts import validate_batch_result, validate_conflict_package

          out = Path("output")
          result = validate_batch_result(json.loads((out / "batch_result.json").read_text()))
          assert result["total_runs"] == 90 and result["workers"] == 2
          comparison = json.loads((out / "branch_comparison.json").read_text())
          assert comparison["variants"][-3:] == ["branch:P1", "branch:P2+P3", "branch:none"]
          package = validate_conflict_package(json.loads((out / "conflict_package.json").read_text()))
          assert [c["proposals"] for c in package["conflicts"]] == [["P1", "P2"], ["P1", "P3"]]
          assert package["recommendation_to_nexus"]["required_decision"] is True
          text = (out / "comparative_report.md").read_text()
          assert text.startswith("# Comparative report — tactical_reference_001_doctrine")
          print("batch verified")
          EOF

      # Phase 17: the briefing from the workspace the steps above wrote
      - name: Briefing export
        run: |
          python scripts/export_briefing.py
          python - <<'EOF'
          from pathlib import Path

          out = Path("output")
          text = (out / "briefing.md").read_text()
          for title in ["Summary", "What happened", "Failure exploration", "Plan comparison", "Reproducibility"]:
              assert f"\n## {title}\n" in text, title
          assert (out / "briefing.pdf").read_bytes().startswith(b"%PDF")
          assert (out / "briefing.docx").read_bytes().startswith(b"PK")
          print("briefing verified")
          EOF

      # Phase 13: the military domain pack on the same engine
      - name: Military domain pack
        run: |
          python scripts/run_tactical_reference.py --scenario data/scenarios/military_urban_001/v0.1.json
          python scripts/run_tactical_reference.py --scenario data/scenarios/military_squad_001/v0.1.json \
            --policy-module examples/tac_angel_policy.py --policy tac_angel_example
          python scripts/export_dataset.py --runs 1 --output output/tac_angel_dataset.jsonl
          python scripts/run_batch.py --batch data/batches/military_doctrine.json --repeats 3 --workers 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.domains.military.dataset import validate_record

          out = Path("output")
          package = json.loads((out / "result_package.json").read_text())
          deciders = {e["source"]["system_id"] for e in package["event_memory"] if e["event_type"] == "ACTION_SELECTED"}
          assert deciders == {"TAC_ANGEL"}, deciders
          records = [json.loads(line) for line in (out / "tac_angel_dataset.jsonl").read_text().splitlines()]
          assert len(records) > 400
          for record in records:
              validate_record(record)
          comparison = json.loads((out / "branch_comparison.json").read_text())
          assert comparison["variants"] == ["aggressive", "overwatch", "defensive"]
          print("military pack verified:", len(records), "records")
          EOF

      # Phase 14: a city on a road network — order, power cascade, supply delay, governance score
      - name: City domain pack
        run: |
          python scripts/build_city_scenarios.py
          git diff --exit-code data/scenarios/city_takeover_001 data/scenarios/city_blackout_001
          python scripts/run_tactical_reference.py --scenario data/scenarios/city_blackout_001/v0.1.json
          python scripts/run_city.py --seeds 3
          python scripts/run_batch.py --batch data/batches/city_supply_delay.json --repeats 2 --workers 2
          python - <<'EOF'
          import json
          from pathlib import Path

          out = Path("output")
          package = json.loads((out / "result_package.json").read_text())
          assert package["evaluation_result"]["winner_or_result"] == "order_not_restored", package["evaluation_result"]["winner_or_result"]
          assert package["final_world_state"]["tick"] == 30
          chain = json.loads((out / "city" / "cascade_city_blackout_001.json").read_text())
          assert chain["cascade_depth"] == 1 and chain["most_dark"] == 7, chain
          takeover = json.loads((out / "city" / "governance_city_takeover_001.json").read_text())
          blackout = json.loads((out / "city" / "governance_city_blackout_001.json").read_text())
          assert takeover["score"] > blackout["score"], (takeover["score"], blackout["score"])
          study = json.loads((out / "city" / "supply_delay.json").read_text())
          orders = [row["mean_end_order"] for row in study["rows"]]
          assert orders[0] > orders[-1], orders
          batch = json.loads((out / "batch_result.json").read_text())
          rates = [variant["win_rate"] for variant in batch["variants"]]
          assert rates[0] == 1.0 and rates[-1] == 0.0, rates
          print("city pack verified: score", takeover["score"], "vs", blackout["score"], "; orders", orders)
          EOF

      # Phase 15: the airspace pack — detection gap, response time, failure points
      - name: Airspace domain pack
        run: |
          python scripts/build_airspace_scenarios.py
          git diff --exit-code data/scenarios/airspace_defence_001
          python scripts/run_tactical_reference.py --scenario data/scenarios/airspace_defence_001/v0.1.json
          python scripts/run_airspace.py --runs 5
          python scripts/run_batch.py --batch data/batches/airspace_sensors.json --repeats 10 --workers 2
          python - <<'EOF'
          import json
          from pathlib import Path

          out = Path("output")
          package = json.loads((out / "result_package.json").read_text())
          verdict = package["evaluation_result"]
          assert verdict["winner_or_result"] == "defended", verdict["winner_or_result"]
          assert verdict["termination_reason"] == "termination_condition_met:threats_resolved"
          outcome = json.loads((out / "airspace" / "outcome_airspace_defence_001.json").read_text())
          assert outcome["leaks"] == 0 and outcome["failure_points"] == [], outcome["failure_points"]
          configs = json.loads((out / "airspace" / "configs.json").read_text())
          assert configs["south radar off"]["uncovered_share"] > configs["as built"]["uncovered_share"]
          behaviors = json.loads((out / "airspace" / "behaviors.json").read_text())
          assert behaviors["close in (engage_at 0.5)"]["mean_leaks"] > behaviors["baseline"]["mean_leaks"]
          batch = json.loads((out / "batch_result.json").read_text())
          rates = [variant["win_rate"] for variant in batch["variants"]]
          assert rates[0] > rates[1], rates
          print("airspace pack verified: rates", rates, "; leaks", behaviors["baseline"]["mean_leaks"], "vs", behaviors["close in (engage_at 0.5)"]["mean_leaks"])
          EOF

      # Phase 18: training data from the sources file, filtered for score gaming
      - name: Training data pipeline
        run: |
          python scripts/build_training_data.py --workers 2
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.training.export import read_jsonl, read_parquet
          from skyvault.training.records import validate_transition

          out = Path("output/training")
          report = json.loads((out / "anti_gaming_report.json").read_text())
          assert report["runs"] == 100 and all(report["buckets"].values()), report["buckets"]
          assert report["success_types"]["genuine_success"] and report["success_types"]["false_success"]
          rejected = {e["output_hash"] for e in report["entries"] if e["bucket"] == "rejected"}
          clean = read_jsonl(out / "clean_training_dataset.jsonl")
          assert not {t["scenario"]["output_hash"] for t in clean} & rejected
          assert read_parquet(out / "clean_training_dataset.parquet") == clean
          for record in clean[:200]:
              validate_transition(record)
          assert len(read_jsonl(out / "branch_evaluation.jsonl")) == 15
          print("training data verified:", report["buckets"], len(clean), "clean transitions")
          EOF

      # Phase 5: what each system sees of one run, under fog of war
      - name: Observation contract
        run: |
          python scripts/observe_run.py
          python scripts/observe_run.py --scenario data/scenarios/military_urban_001/v0.1.json \
            --output output/observations_urban
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from skyvault.contracts import validate_observation

          for folder in ("observations", "observations_urban"):
              out = Path("output") / folder
              docs = {p.stem: json.loads(p.read_text()) for p in out.glob("*.json")}
              assert set(docs) == {"TAC_ANGEL", "STARTX", "NEXUS", "HADES", "AEROGRID"}, set(docs)
              for name, doc in docs.items():
                  for observation in doc["observations"]:
                      assert validate_observation(observation) == observation
              tac, startx = docs["TAC_ANGEL"]["observations"], docs["STARTX"]["observations"]
              assert any(o["hidden_state"]["exists"] for o in tac), folder
              assert all(o["visible_world_state"] != s["visible_world_state"] for o, s in zip(tac, startx))
              assert "position" not in json.dumps([o["visible_world_state"] for o in startx])
              assert not any(o["hidden_state"]["exists"] for o in docs["NEXUS"]["observations"])
              print(folder, "verified:", {n: len(d["observations"]) for n, d in docs.items()})
          EOF
          python scripts/run_tactical_reference.py --scenario data/scenarios/military_squad_001/v0.1.json \
            --policy-module examples/tac_angel_policy.py --policy tac_angel_example

      # Phase 6: participants decide for their own units; nobody touches the world
      - name: Actor layer
        run: |
          python scripts/run_tactical_reference.py --scenario data/scenarios/military_squad_001/v0.1.json \
            --participants tests/fixtures/actors/participants_squad.json
          python - <<'EOF'
          import json
          from pathlib import Path

          package = json.loads(Path("output/result_package.json").read_text())
          deciders = {}
          for e in package["event_memory"]:
              if e["event_type"] in ("ACTION_SELECTED", "NO_ACTION"):
                  deciders.setdefault(e["source"]["actor_id"], set()).add(e["source"]["system_id"])
          assert all(deciders[u] == {"TAC_ANGEL"} for u in ("red_01", "red_02", "red_03")), deciders
          assert deciders["red_04"] == {"HADES"}, deciders
          assert all(v == {"military_baseline"} for k, v in deciders.items() if k.startswith("blue")), deciders
          print("participants verified:", {k: sorted(v) for k, v in sorted(deciders.items())})
          EOF
          python scripts/run_tactical_reference.py --participants tests/fixtures/actors/participants_reference.json
          python scripts/run_tactical_reference.py | tee /tmp/reference.txt
          grep -q "Events: 97" /tmp/reference.txt

      # Phase 11: the world service, served for real, with both queues and stores
      - name: World service
        run: |
          docker compose config -q
          # servers log to files: a background process holding the step's output
          # keeps the step from ever finishing
          python scripts/serve_world.py --store sqlite:////tmp/service.sqlite --port 8100 \
            > /tmp/serve_inprocess.log 2>&1 &
          python scripts/serve_world.py --queue rq --redis "$SKYVAULT_TEST_REDIS" \
            --store "$SKYVAULT_TEST_POSTGRES" --port 8101 > /tmp/serve_rq.log 2>&1 &
          sleep 5
          python - <<'EOF'
          import json, time, urllib.request

          def call(port, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(f"http://127.0.0.1:{port}{path}", data, {"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read())

          status, job = call(8100, "/api/jobs", {"kind": "scenario_run", "scenario": "tactical_reference_001/v0.1"})
          assert status == 202, job
          status, refused = call(8100, "/api/jobs", {"kind": "batch", "batch": "tactical_reference_001", "repeat_count": 1000000})
          assert (status, refused["detail"]["reason"]) == (422, "batch_too_large"), refused
          for _ in range(100):
              if call(8100, f"/api/jobs/{job['job_id']}")[1]["lifecycle_state"] == "completed":
                  break
              time.sleep(0.2)
          status, result = call(8100, f"/api/jobs/{job['job_id']}/result")
          assert result["reproducibility"]["output_hash"].startswith("63090026e137"), result["reproducibility"]
          status, queued = call(8101, "/api/jobs", {"kind": "scenario_run", "scenario": "tactical_reference_001/v0.1", "priority": "high"})
          assert status == 202, queued
          open("/tmp/rq_job.txt", "w").write(queued["job_id"])
          print("world service verified:", job["job_id"], "completed; rq job", queued["job_id"], "queued")
          EOF
          python scripts/world_worker.py --redis "$SKYVAULT_TEST_REDIS" --store "$SKYVAULT_TEST_POSTGRES" --burst
          python - <<'EOF'
          import json, urllib.request
          job_id = open("/tmp/rq_job.txt").read()
          with urllib.request.urlopen(f"http://127.0.0.1:8101/api/jobs/{job_id}") as response:
              job = json.loads(response.read())
          assert job["lifecycle_state"] == "completed", job
          assert job["summary"]["output_hash"].startswith("63090026e137"), job["summary"]
          print("rq worker verified:", job["summary"]["result"])
          EOF

      - name: External systems
        run: |
          python scripts/serve_world.py --store sqlite:// --port 8102 > /tmp/serve_external.log 2>&1 &
          sleep 5
          python - <<'EOF'
          import json, time, urllib.request

          def call(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(f"http://127.0.0.1:8102{path}", data, {"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read())

          fixture = json.load(open("tests/fixtures/external/submissions.json"))
          scenario = "tactical_reference_001/v0.1"

          def act(world_id, action, system):
              order = {k: v for k, v in action.items() if k not in ("tick", "actor_id", "system")}
              status, proposal = call("/action/submit", {"world_id": world_id, "system": system, "tick": action["tick"], "actor_id": action["actor_id"], "order": order})
              assert status == 202, proposal

          # TAC ANGEL acts in a running world and takes back its state-action-outcome
          status, world = call("/world/create", {"scenario": scenario})
          assert status == 201, world
          for action in fixture["tac_angel_plan"]["actions"]:
              act(world["world_id"], action, "TAC_ANGEL")
          call(f"/api/worlds/{world['world_id']}/advance", {"ticks": 3})
          call(f"/api/worlds/{world['world_id']}/finish", {})
          status, sao = call(f"/run/{world['world_id']}/state_action_outcome?system=TAC_ANGEL")
          assert [r["tick"] for r in sao["state_action_outcome"]] == [1, 2, 3], sao

          # conflicting actions hold the world; only an authority decides
          status, world = call("/world/create", {"scenario": scenario})
          for action in fixture["conflicting_actions"]:
              act(world["world_id"], action, action["system"])
          status, held = call(f"/api/worlds/{world['world_id']}/advance", {"ticks": 5})
          conflict = held["awaiting_decision"]
          assert conflict is not None and held["tick"] == 0, held
          status, package = call(f"/conflict/{conflict}/package")
          assert package["recommendation_to_nexus"]["required_decision"] is True, package
          status, refused = call("/branch_conflict/resolve", {"conflict_id": conflict, "branch_id": "none", "decided_by": "SKYVAULT"})
          assert status == 403, refused
          status, decided = call("/branch_conflict/resolve", {"conflict_id": conflict, "branch_id": "TAC_ANGEL:1", "decided_by": "NEXUS"})
          assert (status, decided["decided_by"]) == (200, "NEXUS"), decided
          status, moved = call(f"/api/worlds/{world['world_id']}/advance", {"ticks": 1})
          assert moved["tick"] == 1, moved

          # NEXUS takes the whole result package and the briefing
          status, answer = call("/scenario/submit", {"system": "NEXUS", "kind": "task", "scenario": scenario, "content": {"report_format": "markdown"}})
          assert status == 202, answer
          for _ in range(100):
              status, returned = call(f"/submission/{answer['submission_id']}")
              if status == 200:
                  break
              time.sleep(0.2)
          assert returned["result_package"]["reproducibility"]["output_hash"].startswith("63090026e137"), returned["system_status"]
          assert returned["briefing"].startswith("# SKYVAULT briefing"), returned["briefing"][:80]
          print("external systems verified: state-action-outcome, conflict", conflict, "decided by NEXUS, NEXUS package")
          EOF

  # Phase 17: build the UI, serve it with the reference workspace, and drive
  # every page in a real browser
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install pydantic pyyaml networkx pandas fastapi uvicorn websockets python-docx reportlab

      - name: Write the reference workspace
        run: |
          python scripts/run_tactical_reference.py
          python scripts/explore_failures.py
          python scripts/run_batch.py

      - name: Install and build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Drive every page in a browser
        run: |
          python scripts/serve_ui.py --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          cd ui && SKYVAULT_URL=http://127.0.0.1:8000 npm run e2e
